name: Push Gem

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  push:
    if: github.repository_owner == 'mensfeld'
    runs-on: ubuntu-latest
    environment: deployment
    timeout-minutes: 10

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: '4.0.10'
          bundler-cache: false

      # Install into vendor/bundle, not the Ruby install. release-gem signs the gem with
      # `gem exec sigstore-cli` outside the bundle, so gems in the Ruby install leak into the
      # signer. json 3.x from Gemfile.lock broke sigstore-cli 0.2.3 and v1.14.0 went out
      # without an attestation.
      - name: Bundle install
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      - uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
